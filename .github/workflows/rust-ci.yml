name: Unreleased Rust CLI build and tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build workspace (no prebuilt artifacts)
        run: cargo build --workspace
      - name: Test offline parser and signed intent
        run: cargo test --workspace
      - name: Lint implementation
        run: cargo clippy --workspace --all-targets
      - name: Verify Rust CLI help
        run: cargo run -p hguet -- --help
      - name: Assert VPS endpoint is a non-SSH default and Cloud remains disabled
        run: |
          cargo run -p hguet -- config show --json > /tmp/hguet-cloud-config.json
          python - <<'PY'
          import json
          with open('/tmp/hguet-cloud-config.json',encoding='utf-8') as f:
              data=json.load(f)
          cloud=data['cloud']
          assert cloud['default_endpoint']=='vps-d0669a91.vps.ovh.net:443'
          assert cloud['port']==443 and not cloud['available']
          assert data['local_mode']['cloud_network_access'] is False
          assert '@' not in cloud['default_endpoint']
          print('PASS: Cloud DNS default configured, no SSH username, transport not activated')
          PY
      - name: Validate public schema and illustrative fixtures
        run: |
          python -m pip install 'jsonschema[format]>=4,<5'
          python scripts/validate_json_contracts.py
      - name: Verify restrictive offline local policy and hard DENY
        run: |
          cargo run -p hguet -- policy validate tests/fixtures/policy-devnet-deny.toml --json > /tmp/policy-valid.json
          python - <<'PY'
          import json
          with open('/tmp/policy-valid.json',encoding='utf-8') as f:
              value=json.load(f)
          assert value['status']=='valid' and value['network']=='devnet'
          assert value['cloud_network_access'] is False
          PY
          # A local hard DENY must happen even before an untrusted signed intent
          # can provide an authorization. Intentionally no real intent file here.
          set +e
          cargo run -p hguet -- check tests/fixtures/v1-system-transfer.base64 --encoding base64 --mode local --network devnet --intent tests/fixtures/nonexistent-intent.json --policy tests/fixtures/policy-devnet-deny.toml --json > /tmp/policy-deny.json
          status=$?
          set -e
          test "$status" -eq 20
          python - <<'PY'
          import json
          with open('/tmp/policy-deny.json',encoding='utf-8') as f:
              report=json.load(f)
          assert report['verdict']['decision']=='DENY'
          assert any(x['code']=='POLICY_SOL_TRANSFER_CAP' for x in report['verdict']['findings'])
          assert report['inspection']['declared_system_transfer_lamports']=='500'
          print('PASS: offline policy hard DENY, independent of unsigned intent or Cloud')
          PY
          # Explicit RPC configured, but hard policy DENY must short-circuit
          # without contacting the unresolvable provider.
          set +e
          cargo run -p hguet -- check tests/fixtures/v1-system-transfer.base64 \
            --encoding base64 --mode local --network devnet \
            --intent tests/fixtures/nonexistent-intent.json \
            --policy tests/fixtures/policy-devnet-deny.toml \
            --rpc-url https://never-connect.invalid --json > /tmp/hguet-no-rpc.json
          status=$?
          set -e
          test "$status" -eq 20
          python - <<'PY'
          import json
          with open('/tmp/hguet-no-rpc.json',encoding='utf-8') as f:
              value=json.load(f)
          assert value['verdict']['decision']=='DENY'
          assert value['verdict']['simulation_status']=='not_performed'
          assert any(x['code']=='POLICY_SOL_TRANSFER_CAP' for x in value['verdict']['findings'])
          print('PASS: known hard DENY is resolved before external RPC disclosure')
          PY
      - name: RPC opt-in admission rejects plain HTTP before any network I/O
        run: |
          set +e
          cargo run -p hguet -- check tests/fixtures/v1-system-transfer.base64             --encoding base64 --network devnet --mode local             --intent tests/fixtures/no-intent.json             --rpc-url http://api.devnet.solana.com             --json > /tmp/hguet-bad-rpc.out 2>&1
          status=$?
          set -e
          test "$status" -eq 40
          grep -q 'RPC endpoint must be an explicit HTTPS URL' /tmp/hguet-bad-rpc.out
          # Offline mode and active RPC are mutually exclusive, even with HTTPS.
          set +e
          cargo run -p hguet -- check tests/fixtures/v1-system-transfer.base64             --encoding base64 --network devnet --mode local --offline             --intent tests/fixtures/no-intent.json             --rpc-url https://api.devnet.solana.com             --json > /tmp/hguet-offline-rpc.out 2>&1
          status=$?
          set -e
          test "$status" -eq 40
          grep -q -- '--rpc-url requires check command without --offline' /tmp/hguet-offline-rpc.out
      - name: End-to-end offline CLI JSON smoke
        run: |
          cargo run -p hguet -- inspect tests/fixtures/legacy-noop.base64 --encoding base64 --offline --json > /tmp/hguet-inspect.json
          cargo run -p hguet -- inspect tests/fixtures/v1-system-transfer.base64 --encoding base64 --offline --json > /tmp/hguet-v1.json
          cargo run -p hguet -- inspect tests/fixtures/legacy-spl-transfer-checked.base64 --encoding base64 --offline --json > /tmp/hguet-direct-token.json
          # Public test-only Ed25519 authority from deterministic 0x2a secret.
          # Never use this synthetic key or unsigned fixture with real funds.
          set +e
          cargo run -p hguet -- check tests/fixtures/legacy-spl-transfer-checked.base64 \
            --encoding base64 --mode local --network devnet --offline \
            --intent tests/fixtures/signed-direct-token-cap-equal.json \
            --trusted-key 2iXtA8oeZqUU5pofxK971TCEvFGfems2AcDRaZHKD2pQ \
            --json > /tmp/hguet-mint-cap-equal.json
          equal_status=$?
          cargo run -p hguet -- check tests/fixtures/legacy-spl-transfer-checked.base64 \
            --encoding base64 --mode local --network devnet --offline \
            --intent tests/fixtures/signed-direct-token-cap-over.json \
            --trusted-key 2iXtA8oeZqUU5pofxK971TCEvFGfems2AcDRaZHKD2pQ \
            --json > /tmp/hguet-mint-cap-over.json
          over_status=$?
          set -e
          test "$equal_status" -eq 30
          test "$over_status" -eq 20
          # New source-level, required-signer binding; these are unsigned
          # synthetic transactions and intentionally public test keys.
          set +e
          cargo run -p hguet -- check tests/fixtures/legacy-spl-transfer-checked-authority-signer.base64 \
            --encoding base64 --mode local --network devnet --offline \
            --intent tests/fixtures/signed-direct-token-source-cap-equal.json \
            --trusted-key 2iXtA8oeZqUU5pofxK971TCEvFGfems2AcDRaZHKD2pQ \
            --json > /tmp/hguet-source-cap-equal.json
          source_equal_status=$?
          cargo run -p hguet -- check tests/fixtures/legacy-spl-transfer-checked-authority-signer.base64 \
            --encoding base64 --mode local --network devnet --offline \
            --intent tests/fixtures/signed-direct-token-source-cap-over.json \
            --trusted-key 2iXtA8oeZqUU5pofxK971TCEvFGfems2AcDRaZHKD2pQ \
            --json > /tmp/hguet-source-cap-over.json
          source_over_status=$?
          set -e
          test "$source_equal_status" -eq 30
          test "$source_over_status" -eq 20
          python scripts/check_cli_smoke.py /tmp/hguet-inspect.json /tmp/hguet-v1.json \
            /tmp/hguet-direct-token.json /tmp/hguet-mint-cap-equal.json /tmp/hguet-mint-cap-over.json \
            /tmp/hguet-source-cap-equal.json /tmp/hguet-source-cap-over.json
      - name: Assert isolated signer process cannot accept agent trust, clock, RPC or signing commands
        run: |
          cargo build -p hguet-signer --bin hguet-signer-isolate
          python scripts/check_isolated_signer.py target/debug/hguet-signer-isolate
      - name: Verify Linux Bubblewrap signer sandbox and mandatory fail-closed behavior
        run: |
          python scripts/check_signer_sandbox.py
          # Namespace capability varies by runner/AppArmor policy. Never
          # downgrade: the runtime test requires a sandboxed BLOCK or proves
          # launcher exit 40 with no result or unsandboxed fallback.
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
          fi
          python scripts/check_signer_sandbox_runtime.py
      - name: Assert protected launcher is fail-closed and prevents persistent intent replay
        run: |
          # Host-independent adversarial tests exercise an actual fsync'ed
          # O_EXCL journal with 8 concurrent reservations. The privileged
          # installed root-owned service path is NOT faked as live validated.
          python scripts/check_protected_signer.py
      - name: Exercise administrator-installed protected launcher under separate service UID
        run: |
          set -euo pipefail
          # Synthetic only. Root-owned source, policy and ELF, journal owned by
          # another unprivileged UID. No wallet, network connection or Cloud.
          sudo install -d -m 755 /opt/hguet-ci-protected /opt/hguet-ci-protected/scripts /opt/hguet-ci-protected/bin
          sudo install -d -m 755 /etc/hguet-ci-protected /var/lib/hguet-ci-protected
          sudo install -m 644 scripts/run_signer_protected.py /opt/hguet-ci-protected/scripts/run_signer_protected.py
          sudo install -m 644 scripts/run_signer_sandbox.py /opt/hguet-ci-protected/scripts/run_signer_sandbox.py
          sudo install -m 755 target/debug/hguet-signer-isolate /opt/hguet-ci-protected/bin/hguet-signer-isolate
          sudo install -d -m 700 -o "$(id -u nobody)" -g "$(id -g nobody)" /var/lib/hguet-ci-protected/replay
          digest="$(sha256sum /opt/hguet-ci-protected/bin/hguet-signer-isolate | cut -d' ' -f1)"
          HGUET_TEST_HASH="$digest" python - <<'PY' > /tmp/hguet-ci-protected-policy.json
          import json,os
          print(json.dumps({
              "schema_version":1,"kind":"hguet_protected_signer_policy",
              "binary":"/opt/hguet-ci-protected/bin/hguet-signer-isolate",
              "binary_sha256":os.environ["HGUET_TEST_HASH"],
              "network":"devnet",
              "trusted_key":"2iXtA8oeZqUU5pofxK971TCEvFGfems2AcDRaZHKD2pQ",
              "replay_directory":"/var/lib/hguet-ci-protected/replay"
          },sort_keys=True))
          PY
          sudo install -m 644 /tmp/hguet-ci-protected-policy.json /etc/hguet-ci-protected/policy.json
          trap 'sudo rm -rf /opt/hguet-ci-protected /etc/hguet-ci-protected /var/lib/hguet-ci-protected; rm -f /tmp/hguet-ci-protected-policy.json' EXIT
          python scripts/check_protected_signer_installed.py \
            /opt/hguet-ci-protected/scripts/run_signer_protected.py \
            /etc/hguet-ci-protected/policy.json \
            /var/lib/hguet-ci-protected/replay
      - name: Assert signer-preflight is offline, cryptographic and permanently blocked
        run: |
          # Public synthetic unsigned transaction and public test-only intent key.
          # Neither path may call a wallet, RPC, Cloud or broadcasting service.
          set +e
          cargo run -p hguet -- signer-preflight tests/fixtures/legacy-spl-transfer-checked-authority-signer.base64 \
            --encoding base64 --network devnet --offline \
            --intent tests/fixtures/signed-direct-token-source-cap-equal.json \
            --trusted-key 2iXtA8oeZqUU5pofxK971TCEvFGfems2AcDRaZHKD2pQ \
            --json > /tmp/hguet-signer-valid.json
          valid_status=$?
          cargo run -p hguet -- signer-preflight tests/fixtures/legacy-spl-transfer-checked-authority-signer.base64 \
            --encoding base64 --network devnet --offline \
            --intent tests/fixtures/signed-direct-token-source-cap-equal.json \
            --trusted-key 11111111111111111111111111111111 \
            --json > /tmp/hguet-signer-untrusted.json
          untrusted_status=$?
          cargo run -p hguet -- signer-preflight tests/fixtures/legacy-spl-transfer-checked-authority-signer.base64 \
            --encoding base64 --network devnet --offline \
            --intent tests/fixtures/signed-direct-token-source-cap-equal.json \
            --trusted-key 2iXtA8oeZqUU5pofxK971TCEvFGfems2AcDRaZHKD2pQ \
            --rpc-url https://never-connect.invalid --json > /tmp/hguet-signer-rpc.out 2>&1
          forbidden_rpc_status=$?
          set -e
          test "$valid_status" -eq 20
          test "$untrusted_status" -eq 20
          test "$forbidden_rpc_status" -eq 40
          grep -q 'signer-preflight never sends transaction bytes to RPC' /tmp/hguet-signer-rpc.out
          python scripts/check_signer_preflight.py /tmp/hguet-signer-valid.json /tmp/hguet-signer-untrusted.json
