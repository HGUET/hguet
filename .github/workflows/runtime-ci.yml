name: Independent LiteSVM runtime comparisons
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize evidence outside checkout
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/hguet-runtime-evidence"
          mkdir -p "$evidence"
          echo "HGUET_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/source.txt"
          uname -a > "$evidence/environment.txt"
          echo "RUSTUP_HOME=$RUNNER_TEMP/hguet-rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/hguet-cargo" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Rust toolchain in isolated home
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy 2>&1 | tee "$HGUET_EVIDENCE/rustup.log"
          rustc +1.100.0 -Vv >> "$HGUET_EVIDENCE/environment.txt"
      - name: Install pinned runtime dependencies
        shell: bash
        run: python -m pip install -r testing/runtime/requirements.txt -r testing/requirements.txt 2>&1 | tee "$HGUET_EVIDENCE/pip.log"
      - name: Test fail-closed runtime acceptance
        shell: bash
        run: python -m unittest discover -s testing/runtime -p test_acceptance.py -v 2>&1 | tee "$HGUET_EVIDENCE/acceptance-tests.log"
      - name: Build locked read-only CLI
        id: build
        shell: bash
        run: cargo +1.100.0 build --locked -p hguet 2>&1 | tee "$HGUET_EVIDENCE/build.log"
      - name: Record source and runtime environment
        run: |
          git rev-parse HEAD >> "$HGUET_EVIDENCE/source.txt"
          git status --porcelain >> "$HGUET_EVIDENCE/source.txt"
          python --version >> "$HGUET_EVIDENCE/environment.txt"
          python -m pip freeze >> "$HGUET_EVIDENCE/environment.txt"
          sha256sum target/debug/hguet > "$HGUET_EVIDENCE/cli.sha256"
      - name: Compare actual execution with offline HGUET declarations
        shell: bash
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=LD_LIBRARY_PATH unshare --net -- "$python_path" testing/runtime/native.py \
            --hguet "$PWD/target/debug/hguet" --out "$HGUET_EVIDENCE/result.json" \
            2>&1 | tee "$HGUET_EVIDENCE/runtime.log"
      - name: Verify program intelligence with SDK fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=LD_LIBRARY_PATH unshare --net -- "$python_path" testing/runtime/programs_preview.py \
            --hguet "$PWD/target/debug/hguet" --out "$HGUET_EVIDENCE/programs-preview.json" \
            2>&1 | tee "$HGUET_EVIDENCE/programs-preview.log"
      - name: Verify asset flow with SDK fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=LD_LIBRARY_PATH unshare --net -- "$python_path" testing/runtime/flow_preview.py \
            --hguet "$PWD/target/debug/hguet" --out "$HGUET_EVIDENCE/flow-preview.json" \
            2>&1 | tee "$HGUET_EVIDENCE/flow-preview.log"
      - name: Verify authority intelligence with SDK fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=LD_LIBRARY_PATH unshare --net -- "$python_path" testing/runtime/authority_preview.py \
            --hguet "$PWD/target/debug/hguet" --out "$HGUET_EVIDENCE/authority-preview.json" \
            2>&1 | tee "$HGUET_EVIDENCE/authority-preview.log"
      - name: Verify semantic transaction diff with SDK fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          python_path="$(command -v python)"
          sudo --preserve-env=LD_LIBRARY_PATH unshare --net -- "$python_path" testing/runtime/diff_preview.py \
            --hguet "$PWD/target/debug/hguet" --out "$HGUET_EVIDENCE/diff-preview.json" \
            2>&1 | tee "$HGUET_EVIDENCE/diff-preview.log"
      - name: Verify Phase 1 local acceptance contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          python scripts/run_phase01_checks.py --evidence "$HGUET_EVIDENCE" --hguet target/debug/hguet
      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$HGUET_EVIDENCE"
          cd "$HGUET_EVIDENCE"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litesvm-runtime-evidence
          path: ${{ runner.temp }}/hguet-runtime-evidence/
          if-no-files-found: error
