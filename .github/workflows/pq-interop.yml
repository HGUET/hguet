name: "PQ interoperability (ML-DSA-87 known answers, protocol harness)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "testing/cloud-value/**"
      - "testing/tests/**"
      - "protocol/**"
permissions:
  contents: read
jobs:
  mldsa:
    # GitHub-hosted Ubuntu images ship OpenSSL 3.0 (no ML-DSA). Ubuntu 26.04 ships OpenSSL 3.5,
    # so the FIPS 204 known-answer tests and the signed-payload flow run for real in this container.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 20
    env:
      HGUET_REQUIRE_PQ: "1"   # a skipped ML-DSA test must fail here
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-jsonschema python3-yaml openssl git ca-certificates
          openssl version
          openssl list -signature-algorithms | grep -i ml-dsa-87
      - uses: actions/checkout@v4
      - name: ML-DSA-87 NIST ACVP known answers, protocol codec, TLS flow harness (no skips allowed)
        shell: bash
        run: |
          python3 -m unittest discover -s testing/tests -v > /tmp/out.txt 2>&1 || { tail -80 /tmp/out.txt; exit 1; }
          tail -6 /tmp/out.txt
          if grep -q "skipped" /tmp/out.txt; then echo "::error::a test was skipped; ML-DSA coverage is unverified"; grep -E "skipped|SKIP" /tmp/out.txt | head; exit 1; fi
