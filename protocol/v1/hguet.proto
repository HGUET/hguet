// HGUET PUBLIC protocol v1: UNRELEASED DRAFT (v0.2 accountless SOL pay-per-check).
// Transport: server-authenticated PQ-capable TLS 1.3, then 4-byte network-order
// frame size and exactly one Protobuf Envelope. Max frame size 1 MiB.
// There is NO mandatory account, no balance, no client enrollment and no USDC.
// The HGUET private server must consume this PUBLIC schema without forking it.
syntax = "proto3";
package hguet.protocol.v1;

enum ResultCode {
  RESULT_UNSPECIFIED = 0;
  RESULT_ACCEPTED = 1;
  RESULT_PENDING = 2;
  RESULT_COMPLETED = 3;
  RESULT_REJECTED = 4;
  RESULT_FAILED_RETRYABLE = 5;
  RESULT_REFUND_REQUIRED = 6;
}

enum ErrorCode {
  ERROR_UNSPECIFIED = 0;
  ERROR_PROTOCOL_UNSUPPORTED = 1;
  ERROR_BAD_REQUEST = 2;
  ERROR_PRICE_UNAVAILABLE = 3;
  ERROR_ORACLE_STALE = 4;
  ERROR_QUOTE_EXPIRED = 5;
  ERROR_PRICE_EXCEEDED = 6;
  ERROR_INVALID_PAYMENT = 7;
  ERROR_PAYMENT_NOT_FINALIZED = 8;
  ERROR_PAYMENT_ALREADY_CLAIMED = 9;
  ERROR_WRONG_NETWORK = 10;
  ERROR_CLAIM_AUTH_FAILED = 11;
  ERROR_MISSING_CONSENT = 12;
  ERROR_IDEMPOTENCY_CONFLICT = 13;
  ERROR_RATE_LIMITED = 14;
  ERROR_UNAVAILABLE = 15;
  ERROR_UNKNOWN_CRITICAL_FIELD = 16;
}

enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_METADATA_ONLY = 1;
  DATA_SCOPE_RAW_TRANSACTION = 2;
}

message Envelope {
  uint32 protocol_major = 1;     // draft v1
  uint32 protocol_minor = 2;     // draft minor 0
  bytes request_id = 3;          // exactly 16 unpredictable bytes
  oneof payload {
    ClientHello client_hello = 10;
    ServerHello server_hello = 11;
    PriceQuoteRequest price_quote_request = 12;
    PriceQuoteResult price_quote_result = 13;
    PaidCheckRequest paid_check_request = 14;
    CheckReceipt check_receipt = 15;
    PaidCheckStatus paid_check_status = 16;
    CheckResult check_result = 17;
    ProtocolError error = 18;
  }
}

message ClientHello {
  repeated uint32 supported_majors = 1;
  uint32 max_minor = 2;
  repeated string requested_capabilities = 3;
  string cli_release = 4;
}
message ServerHello {
  uint32 selected_major = 1;
  uint32 selected_minor = 2;
  repeated string available_capabilities = 3;
  string server_release = 4;
}

message Subject {
  string category = 1;           // program, mint, destination or merchant
  string network = 2;
  string subject_id = 3;
}
message ClientEvidence {
  bytes canonical_local_evidence_json = 1; // redacted, never trusted blindly
  repeated Subject subjects = 2;
  string local_decision = 3;               // advisory local context ONLY
}

// Server-signed JSON schema: protocol/v1/payment-quote.schema.json.
// Amount is calculated by server from configured USD tariff and fresh SOL/USD.
// Quote is scoped to ONE exact analysis and ONE buyer-held claim secret.
// No service credits, no wallet private key input, no user account.
message PriceQuoteRequest {
  string network = 1;                   // mainnet/devnet/testnet
  string genesis_hash = 2;              // verified cluster
  bytes message_sha256 = 3;             // exactly 32 bytes
  bytes intent_sha256 = 4;              // 32 bytes or absent
  string profile = 5;
  repeated string requested_capabilities = 6;
  DataScope scope = 7;
  bytes claim_secret_sha256 = 8;        // exactly 32 bytes; never reveal secret now
  string maximum_lamports = 9;          // unsigned decimal integer; user cap
  repeated Subject subjects = 10;      // present for metadata-only intelligence
  bytes subjects_sha256 = 11;          // canonical subject set binding, exactly 32 bytes
}
message PriceQuoteResult {
  ResultCode result = 1;
  SignedPayload signed_quote = 2;       // HGUET-SOL-QUOTE/v1; includes exact lamports
}

// Sent only AFTER the user's separate wallet signed/broadcast a SOL transfer.
// Claim secret stays OFF-CHAIN. Quote ID, network, message and optional raw bytes
// must match the server-stored signed quote. Payment hash is NOT the checked tx.
message PaidCheckRequest {
  bytes quote_id = 1;                 // 16 bytes issued by server
  bytes claim_secret = 2;             // 32-byte bearer secret over authenticated TLS
  string payment_transaction_signature = 3;  // Base58 Solana signature of SOL invoice
  bytes message_sha256 = 4;           // exact checked message
  bytes transaction_sha256 = 5;       // original wire fingerprint when available
  bytes intent_sha256 = 6;            // matches quote or absent
  string network = 7;
  string genesis_hash = 8;
  string profile = 9;
  repeated string requested_capabilities = 10;
  DataScope scope = 11;
  bytes raw_transaction = 12;         // only with explicit consent
  bool raw_transaction_consent = 13;
  ClientEvidence evidence = 14;
  bytes subjects_sha256 = 15;          // must match signed quote and canonical evidence subjects
}
message PaidCheckStatus {
  bytes quote_id = 1;
  bytes claim_secret = 2;             // proof of ownership of ONE payment result
}
message CheckReceipt {
  ResultCode result = 1;             // accepted/pending, NEVER a verdict
  bytes quote_id = 2;
  string state = 3;                   // payment_pending, running, retryable ...
  uint32 retry_after_seconds = 4;
}
message SignedPayload {
  bytes canonical_payload = 1;       // JCS canonical JSON
  bytes signature = 2;               // signed with tested maintained crypto suite
  string key_id = 3;                 // authenticated trust rotation
  string signing_algorithm = 4;
}
message CheckResult {
  ResultCode result = 1;             // terminal completed
  bytes quote_id = 2;
  SignedPayload signed_cloud_assessment = 3; // not the final CLI SecurityVerdict
  SignedPayload signed_payment_receipt = 4; // HGUET-SOL-PAYMENT-RECEIPT/v1
}
message ProtocolError {
  ErrorCode code = 1;
  string safe_message = 2;
  bool retryable = 3;
  uint32 retry_after_seconds = 4;
}
